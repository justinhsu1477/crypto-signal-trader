plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'com.google.protobuf' version '0.9.4'
}

group = 'com.trader'
version = '1.0.0' // x-release-please-version

java {
    sourceCompatibility = '17'
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        // Spring AI BOM — 對齊 lndata/gen-bi 慣例（1.0.3 GA 穩定版）
        // 鎖定 spring-ai-* 所有 module 版本，避免手動跨 module version mismatch
        mavenBom 'org.springframework.ai:spring-ai-bom:1.0.3'
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'          // 保留給未來測試用

    // Flyway DB Migration
    // 10.x（隨 Boot 3.4 帶入）把 PostgreSQL 支援從 flyway-core 拆出來，要顯式加
    // 否則啟動會炸：FlywayException: No database found to handle jdbc:postgresql://...
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Stripe 訂閱計費
    implementation 'com.stripe:stripe-java:28.2.0'

    // Actuator + Micrometer（Observability — 系統指標 + Prometheus）
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // Redis 快取層（分散式快取 — 廣播跟單效能優化 + 未來多實例共享）
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // RabbitMQ 訊息佇列（通知非同步化 + 重試 + 持久化）
    implementation 'org.springframework.boot:spring-boot-starter-amqp'

    // WebSocket（STOMP over SockJS — 公告即時推送）
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // OkHttp for Binance API calls
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'

    // HMAC SHA256 signing (Binance requires this)
    // Java built-in javax.crypto is sufficient

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // JDA（Discord Bot — AI 客服）
    implementation 'net.dv8tion:JDA:5.2.2'

    // gRPC（Python Monitor 即時配置推送）
    implementation 'net.devh:grpc-spring-boot-starter:3.1.0.RELEASE'
    implementation 'io.grpc:grpc-protobuf:1.62.2'
    implementation 'io.grpc:grpc-stub:1.62.2'
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'

    // ─── Spring AI（Phase 1 接線） ───
    // 對齊 lndata/gen-bi 的 multi-provider pattern。
    //
    // 暫用 OpenAI starter 對 Gemini 的 OpenAI-compat endpoint
    // (https://generativelanguage.googleapis.com/v1beta/openai/) — 因為：
    //  - Spring AI 1.0.3 (GA) 還沒有原生 google-genai starter（1.1.x M 才加）
    //  - Vertex AI 路徑需要 GCP project + service account，非 API key
    //  - OpenAI-compat path 讓 API key 沿用既有 GEMINI_API_KEY
    //
    // 將來要切真 OpenAI / Anthropic：加對應 starter + 改 config，code 不變。
    // 將來 Spring AI 1.1.x GA 後可改回 spring-ai-starter-model-google-genai 拿原生 Gemini 功能。
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
}

// ─── Protobuf / gRPC Code Generation ───
sourceSets {
    main {
        proto {
            srcDir "${rootDir}/proto"
        }
    }
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.3'
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.62.2'
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

tasks.named('test') {
    useJUnitPlatform {
        // 預設排除 @Tag("integration") 測試（Testcontainers 需 Docker daemon，CI 不一定穩）
        // 手動跑 integration tests：./gradlew integrationTest
        excludeTags 'integration'
    }
    finalizedBy jacocoTestReport
}

// 獨立的 integration test task — 需要 Docker daemon（Testcontainers PostgreSQL）
tasks.register('integrationTest', Test) {
    description = '執行 @Tag("integration") 標記的整合測試（需 Docker daemon）'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'integration'
    }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter tasks.named('test')
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true   // CI 讀取用
        html.required = true  // 本地瀏覽用
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.70  // 70% 門檻（金融系統標準）
            }
        }
    }
}

// 確保 build 時自動執行覆蓋率檢查
tasks.named('check') {
    dependsOn jacocoTestCoverageVerification
}
