plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'com.google.protobuf' version '0.9.4'
}

group = 'com.trader'
version = '1.0.0'

java {
    sourceCompatibility = '17'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'          // 保留給未來測試用

    // Flyway DB Migration（9.x — PostgreSQL 支援已內建於 flyway-core）
    implementation 'org.flywaydb:flyway-core'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Stripe 訂閱計費
    implementation 'com.stripe:stripe-java:28.2.0'

    // Actuator + Micrometer（Observability — 系統指標 + Prometheus）
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // Redis 快取層（分散式快取 — 廣播跟單效能優化 + 未來多實例共享）
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // RabbitMQ 訊息佇列（通知非同步化 + 重試 + 持久化）
    implementation 'org.springframework.boot:spring-boot-starter-amqp'

    // WebSocket（STOMP over SockJS — 公告即時推送）
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // OkHttp for Binance API calls
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'

    // HMAC SHA256 signing (Binance requires this)
    // Java built-in javax.crypto is sufficient

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // gRPC（Python Monitor 即時配置推送）
    implementation 'net.devh:grpc-spring-boot-starter:3.1.0.RELEASE'
    implementation 'io.grpc:grpc-protobuf:1.62.2'
    implementation 'io.grpc:grpc-stub:1.62.2'
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

// ─── Protobuf / gRPC Code Generation ───
sourceSets {
    main {
        proto {
            srcDir "${rootDir}/proto"
        }
    }
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.3'
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.62.2'
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true   // CI 讀取用
        html.required = true  // 本地瀏覽用
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.70  // 70% 門檻（金融系統標準）
            }
        }
    }
}

// 確保 build 時自動執行覆蓋率檢查
tasks.named('check') {
    dependsOn jacocoTestCoverageVerification
}
