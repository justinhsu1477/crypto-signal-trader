# ========================================
# Cloud 環境 — Caddy + Spring Boot + Dashboard（不含 Python Monitor）
# ========================================
# 使用方式:
#   docker compose -f docker-compose.cloud.yml up -d
#
# Image 由 GitHub Actions CD 自動建構推送到 GHCR，VM 只需 pull + restart
#
# SSL: Cloudflare Full (Strict) + Origin Certificate
#   - certs/ 目錄需放入 origin-cert.pem 和 origin-key.pem
#   - 詳見 certs/README.md
#
# Python Monitor 在本地直跑（不在 Docker 內），透過 Caddy :443 連 API
# DB 使用 Neon 雲端，不需本地 PostgreSQL

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    expose:
      - "5672"
    ports:
      - "127.0.0.1:15672:15672"   # Management UI（僅 localhost，SSH tunnel 存取）
    env_file:
      - .env.prod
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
      - "9443:9443"    # gRPC（Python Monitor 從地端連入）
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
    depends_on:
      trading-api:
        condition: service_healthy
    restart: unless-stopped

  trading-api:
    image: ghcr.io/justinhsu1477/crypto-signal-trader/trading-api:latest
    container_name: trading-api
    expose:
      - "8080"
      - "9090"          # gRPC（Caddy 代理用）
    env_file:
      - .env.prod
    environment:
      - REDIS_HOST=redis              # Docker 內部 DNS（覆蓋 .env.prod 的預設值）
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  web-dashboard:
    image: ghcr.io/justinhsu1477/crypto-signal-trader/web-dashboard:latest
    container_name: web-dashboard
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://trading-api:8080
    depends_on:
      trading-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  redis_data:
  rabbitmq_data:
