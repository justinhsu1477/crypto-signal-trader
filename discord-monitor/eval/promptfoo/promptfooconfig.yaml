# Promptfoo eval config — PoC for AI signal parser
#
# Wraps the real Python AiSignalParser (via provider.py) so we test the same
# code path as production runs (compound detection, fallback, etc.).
# Reuses scorer.py (via assertion.py) so scoring rubric stays identical.
#
# Usage (local):
#   cd discord-monitor/eval/promptfoo
#   npm install                           # installs promptfoo
#   export GEMINI_API_KEY=...
#   EVAL_LIMIT=5 npx promptfoo eval       # quick 5-case PoC
#   npx promptfoo view                    # open HTML report
#
# Filter:
#   EVAL_FILTER=compound npx promptfoo eval   # only `compound_*` cases
description: AI signal parser eval (PoC) — reuses cases.jsonl + scorer.py

# Prompt = raw discord message text passed as-is to AiSignalParser.parse().
# Without this, Promptfoo's default template wraps vars and provider gets garbage.
prompts:
  - '{{ input }}'

# Use our Python provider that wraps AiSignalParser
providers:
  - id: file://provider.py
    label: gemini-via-AiSignalParser

# Test cases generated by Python loader from cases.jsonl
# (avoids duplicating data; one source of truth)
tests: file://tests_loader.py:generate_tests

# Default assertion for every case — Python wrapper around scorer.py
defaultTest:
  assert:
    - type: python
      value: file://assertion.py

# Promptfoo output options
outputPath: result.json

# Caching: skip identical (prompt, provider) combos — saves Gemini tokens
# when only scorer / prompt config changes between runs
cache:
  enabled: true
