# ========================================
# Dev 環境 — Binance Futures Testnet
# ========================================
# Testnet API Key 申請: https://testnet.binancefuture.com (GitHub 登入)
# API 文件: https://developers.binance.com/docs/derivatives/

binance:
  futures:
    base-url: https://testnet.binancefuture.com
    # 配合 prod 遷移，testnet 使用同結構 /private/ws endpoint
    # 若 testnet 尚未支援新 endpoint，dev 測試時可暫時 revert 為 /ws/
    ws-base-url: wss://stream.binancefuture.com/private/ws
  risk:
    dedup-enabled: false    # dev 環境關閉重複訊號防護，方便測試

spring:
  jpa:
    show-sql: true

logging:
  level:
    com.trader: DEBUG

jwt:
  secret: dev-only-jwt-secret-not-for-production-must-be-at-least-256-bits-long!!
  cookie-secure: false

encryption:
  aes-key: dev-only-aes-key-not-for-prod!!
