app:
  timezone: Asia/Taipei

# ========== 多用戶模式 ==========
# false = 單用戶（全局 RiskConfig + 不分用戶查詢）
# true  = 多用戶（per-user 交易參數 + userId 隔離查詢 + 多 WebSocket）
multi-user:
  enabled: ${MULTI_USER_ENABLED:false}

# ========== 多用戶支援配置 ==========
trading:
  user-id: ${TRADING_USER_ID:system-trader}  # 單用戶模式的用戶 ID
                                              # SingleUserInitializer 啟動時自動建立此用戶

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-http-form-post-size: 1MB      # POST form 最大 1MB
    max-swallow-size: 1MB             # 超過直接斷連，不讀取
  servlet:
    multipart:
      max-file-size: 1MB              # 單檔上限
      max-request-size: 2MB           # 整個 request 上限

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ========== RabbitMQ 訊息佇列 ==========
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        prefetch: 10                     # 流量控制：一次拿 10 個訊息
        retry:
          enabled: true                  # 面試重點：Spring retry interceptor 包住 listener
          max-attempts: 3                # 最多重試 3 次（含首次）
          initial-interval: 1000         # 首次重試等 1 秒
          multiplier: 2.0               # 指數退避：1s → 2s → 4s
          max-interval: 10000            # 最大等待 10 秒
        # acknowledge-mode 預設 auto：成功 → ACK，失敗 → retry → 耗盡 → DLQ

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trading}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:trading}
    password: ${DB_PASSWORD:trading}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}  # 配合廣播線程池 max=50，留 buffer
      minimum-idle: 5
      connection-timeout: 10000     # 10 秒等不到連線就失敗
      idle-timeout: 300000          # 閒置 5 分鐘回收
      keepalive-time: 120000        # 每 2 分鐘探測，防止 Neon 斷閒置連線
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true       # 既有 DB 自動建立 baseline（跳過 V1）
    baseline-version: 1
    locations: classpath:db/migration

binance:
  futures:
    api-key: ${BINANCE_API_KEY:YOUR_API_KEY}
    secret-key: ${BINANCE_SECRET_KEY:YOUR_SECRET_KEY}

  # 風控設定
  risk:
    max-position-usdt: 50000      # 單筆最大名目價值 (USDT) — 防止窄止損產生超大倉位
    max-daily-loss-usdt: 2000     # 每日虧損絕對硬上限 (USDT)
    daily-loss-percent: 0.80      # 每日虧損動態上限 = 當日開盤餘額 × 80%（取 min(動態, 絕對)）
    max-position-percent: 0       # 倉位動態上限 = 即時餘額 × N%（0 = 不啟用，用絕對值）
    # 動態以損定倉: 1R = 帳戶餘額 × risk-percent, 補倉用 2R
    risk-percent: 0.20            # 單筆風險比例 (20% = 0.20)
    max-dca-per-symbol: 3         # 同幣種最多 3 層（首次入場 + 2 次補倉）
    dca-risk-multiplier: 2.0      # 補倉風險倍數（2R = 首倉的 2 倍風險金額）
    fixed-leverage: 20            # 固定槓桿 (逐倉 ISOLATED)
    default-symbol: BTCUSDT        # 訊號無幣種時的預設交易對（Java 端會 fallback 查 OPEN trade）
    allowed-symbols:              # 允許的交易對清單（可加多個）
      - BTCUSDT

discord:
  webhook:
    url: ${DISCORD_WEBHOOK_URL:}                    # Discord Webhook URL（全局 fallback）
    enabled: ${DISCORD_WEBHOOK_ENABLED:false}       # 是否啟用通知
    # 多用戶 webhook 配置
    per-user:
      enabled: ${DISCORD_WEBHOOK_PER_USER_ENABLED:true}  # true = 使用用戶自定義 webhook，false = 使用全局
      fallback-to-global: ${DISCORD_WEBHOOK_FALLBACK:true}  # 用戶無自定義 webhook 時 fallback 到全局

# ========== LINE Messaging API ==========
line:
  channel-id: ${LINE_CHANNEL_ID:}
  channel-secret: ${LINE_CHANNEL_SECRET:}
  channel-access-token: ${LINE_CHANNEL_ACCESS_TOKEN:}
  enabled: ${LINE_ENABLED:false}
  linking-code-expiry-minutes: 10
  rich-menu:
    enabled: ${LINE_RICH_MENU_ENABLED:true}
    force-rebuild: ${LINE_RICH_MENU_FORCE_REBUILD:false}
    web-base-url: ${LINE_WEB_BASE_URL:https://hook-fi.com}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}

# ========== USDT TRC20 加密貨幣收款 ==========
crypto:
  payment:
    enabled: ${CRYPTO_PAYMENT_ENABLED:true}
    network: TRC20
    wallet-address: ${CRYPTO_WALLET_ADDRESS:}
    trongrid-api-key: ${TRONGRID_API_KEY:}
    confirmation-blocks: 20
    subscription-days: 30

jwt:
  secret: ${JWT_SECRET:default-dev-secret-change-in-production-must-be-at-least-256-bits-long}
  expiration-ms: 1800000           # 30 分鐘（交易平台安全標準）
  refresh-expiration-ms: 259200000  # 3 days
  cookie-secure: ${JWT_COOKIE_SECURE:true}

encryption:
  aes-key: ${AES_ENCRYPTION_KEY:default-aes-key-change-in-prod!!}

# Monitor API Key（Python Monitor 內部服務認證）
monitor:
  api-key: ${MONITOR_API_KEY:}

# AI 交易顧問
advisor:
  enabled: ${ADVISOR_ENABLED:false}
  gemini-api-key: ${GEMINI_API_KEY:}
  gemini-model: gemini-2.0-flash
  cron-expression: "0 0 2,6,10,14,18,22 * * *"
  max-response-tokens: 1024
  recent-trades-count: 10
  temperature-value: 0.7
  scoring-enabled: ${ADVISOR_SCORING_ENABLED:false}

# ========== Email OTP 驗證 + 密碼重設 ==========
email:
  enabled: ${EMAIL_ENABLED:false}
  resend-api-key: ${RESEND_API_KEY:}
  from-address: ${EMAIL_FROM:noreply@hookfi.com}
  otp-expiry-minutes: 10
  max-attempts-per-code: 3
  max-sends-per-hour: 5
  reset-token-expiry-minutes: 60
  max-reset-per-quarter-hour: 3
  app-base-url: ${APP_BASE_URL:http://localhost:3000}

# ========== 推薦系統 ==========
referral:
  default-exchange: BINANCE
  referral-link: ${REFERRAL_LINK:https://www.binance.com/activity/referral-entry/CPA?ref=CPA_GRO_28502_3UMIS}
  referral-code: ${REFERRAL_CODE:GRO_28502_3UMIS}

logging:
  level:
    com.trader: DEBUG
