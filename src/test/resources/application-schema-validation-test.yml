# Hibernate schema validation 專用 profile
# 唯一目的：用真 Flyway migration 起 schema 後，Hibernate ddl-auto=validate
# 嚴格比對 entity @Column vs DB column type，抓 CHAR vs VARCHAR 那類靜默 mismatch
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/test    # @DynamicPropertySource 覆蓋
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: validate                          # 關鍵：嚴格驗證（Spring Boot 會自動 propagate 到 hibernate.hbm2ddl.auto）
    show-sql: false
  flyway:
    enabled: true                                 # 跑真 migration
    # 兩條 location 合併：prod migration + 此 profile 專用的 placeholder users seed。
    # V19.1 排在 V19 跟 V20 之間，預先建 beck-tsai / justin-hsu 滿足 V20 FK constraint。
    locations:
      - classpath:db/migration
      - classpath:db/migration-test-seed
    baseline-on-migrate: false
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: none
  rabbitmq:
    host: localhost
    port: 5672
    listener:
      simple:
        auto-startup: false

  # Spring AI — 給假 OpenAI key 讓 OpenAiChatModel bean 能 init（測試不打外網）。
  # 空字串會讓 Spring AI 1.0.3 OpenAI auto-config 的 Assert.notNull 拋例外，整個 context 起不來。
  ai:
    openai:
      api-key: schema-validation-fake-openai-key
      base-url: http://localhost:9999/openai-not-used

# JWT / encryption — placeholder 兜底（不真用，避免 @Value 解析失敗 startup fail）
jwt:
  secret: schema-validation-test-secret-minimum-256-bits-long-enough-for-hmac
  expiration-ms: 1800000
  refresh-expiration-ms: 259200000
  cookie-secure: false

encryption:
  aes-key: 0123456789abcdef0123456789abcdef

monitor:
  api-key: test-monitor-key

ai:
  api-key: ""
  default-model: gemini-2.5-flash-lite

binance:
  futures:
    base-url: https://testnet.binancefuture.com
    ws-base-url: wss://stream.binancefuture.com/private/ws
    api-key: schema-test-fake-api-key
    secret-key: schema-test-fake-secret-key
  risk:
    dedup-enabled: false

# 全部外部服務關閉
discord:
  webhook:
    enabled: false
  bot:
    enabled: false

chatbot:
  enabled: false

advisor:
  enabled: false

line:
  enabled: false

email:
  enabled: false
  max-sends-per-hour: 10000
  max-reset-per-quarter-hour: 10000

mirror:
  enabled: false

# 關閉 gRPC server — 避免 port 9090 衝突導致 Spring context 起不來。
# 此 test 只關心 Hibernate schema validation，不需要 gRPC。
# net.devh:grpc-spring-boot-starter 約定：port -1 = 不啟動 server。
# port=-1 必要（驗證過 enabled=false 單獨用無效），enabled=false 保險再加。
grpc:
  server:
    port: -1
    enabled: false
