# Integration Test profile — Testcontainers PostgreSQL + Flyway migrations
# DB URL 由 @DynamicPropertySource 覆蓋

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/test  # overridden by Testcontainers
    username: test
    password: test
  jpa:
    hibernate:
      # 用 Hibernate 建 schema，不跑歷史 Flyway migration（V20 寫死 user_id 會 FK violation）
      # Integration test 驗證功能行為，不驗證 migration 流程
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: none
  rabbitmq:
    host: localhost
    port: 5672
    listener:
      simple:
        auto-startup: false

# JWT
jwt:
  secret: integration-test-secret-key-minimum-256-bits-long-enough-for-hmac
  expiration-ms: 1800000
  refresh-expiration-ms: 259200000
  cookie-secure: false

# Encryption
encryption:
  aes-key: 0123456789abcdef0123456789abcdef

# Monitor
monitor:
  api-key: test-monitor-key

# AI
ai:
  api-key: ""
  default-model: gemini-2.5-flash-lite

# Binance — integration test 不真打 Binance，只需要避免 @Value placeholder 解析失敗
binance:
  futures:
    base-url: https://testnet.binancefuture.com
    ws-base-url: wss://stream.binancefuture.com/private/ws
    api-key: integration-test-fake-api-key
    secret-key: integration-test-fake-secret-key
  risk:
    # 關閉 signal-level dedup：integration test 用同樣 fixture 跑多次，
    # in-memory cache (5min window) 會讓第二個測試永遠 SKIPPED
    dedup-enabled: false

# 停用所有外部服務
discord:
  webhook:
    enabled: false
  bot:
    enabled: false

chatbot:
  enabled: false

advisor:
  enabled: false

line:
  enabled: false

email:
  enabled: false
  # 整合測試多個 test class 共用 test@hookfi.com，會超過 prod 預設 5/hour 限制 → 429。
  max-sends-per-hour: 10000
  max-reset-per-quarter-hour: 10000
