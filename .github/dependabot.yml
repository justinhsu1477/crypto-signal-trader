version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /web-dashboard
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /discord-monitor
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /web-dashboard
    schedule:
      interval: weekly
      day: monday
      time: "10:15"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /discord-monitor
    schedule:
      interval: weekly
      day: monday
      time: "10:30"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
