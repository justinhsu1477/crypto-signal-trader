name: CD

on:
  push:
    branches: [main]        # push main → 自動 build + push GHCR + 部署
  workflow_dispatch:         # 手動觸發（也會 build + 部署）

# 同一 branch 新 push 進來 → 取消正在跑的舊 build，只保留最新
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # 小寫 — GHCR 要求 image name 全小寫
  IMAGE_PREFIX: ghcr.io/justinhsu1477/crypto-signal-trader

jobs:
  # ============================================================
  # 1. 建構 Docker images 並推到 GHCR（每次 push main 自動執行）
  # ============================================================
  build-and-push:
    name: 🏗️ 建構 & 推送 Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: 登入 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 設定 Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- 後端 API ---
      - name: 建構 & 推送 trading-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/trading-api:latest
            ${{ env.IMAGE_PREFIX }}/trading-api:${{ github.sha }}
          cache-from: type=gha,scope=trading-api
          cache-to: type=gha,mode=max,scope=trading-api

      # --- 前端 Dashboard ---
      - name: 建構 & 推送 web-dashboard
        uses: docker/build-push-action@v6
        with:
          context: ./web-dashboard
          file: ./web-dashboard/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/web-dashboard:latest
            ${{ env.IMAGE_PREFIX }}/web-dashboard:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://trading-api:8080
          cache-from: type=gha,scope=web-dashboard
          cache-to: type=gha,mode=max,scope=web-dashboard

  # ============================================================
  # 2. 部署到正式環境（只需 pull，不用 build）
  # ============================================================
  deploy:
    name: 🚀 部署到正式環境
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: 透過 SSH 部署
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd /root/crypto-signal-trader
            git pull origin main

            # 登入 GHCR（用 PAT 或 deploy token）
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 拉取預建映像 & 啟動（不再 --build）
            docker compose -f docker-compose.cloud.yml pull
            docker compose -f docker-compose.cloud.yml up -d

            # 清理舊映像
            docker image prune -f
