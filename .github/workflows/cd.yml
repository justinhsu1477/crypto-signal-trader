name: CD

on:
  # CI 完成後才觸發（取代原本的 push:main，避免 CI 沒過就部署）
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:         # 手動觸發（跳過 CI 直接部署）

# 同一 branch 新 push 進來 → 取消正在跑的舊 build，只保留最新
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # 小寫 — GHCR 要求 image name 全小寫
  IMAGE_PREFIX: ghcr.io/justinhsu1477/crypto-signal-trader

jobs:
  # ============================================================
  # 1. 建構 Docker images 並推到 GHCR
  # ============================================================
  build-and-push:
    name: 🏗️ 建構 & 推送 Docker Images
    runs-on: ubuntu-latest
    # workflow_run 觸發時：只有 CI 成功才執行
    # workflow_dispatch 觸發時：直接執行（手動部署）
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: 登入 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 設定 Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- 後端 API ---
      - name: 建構 & 推送 trading-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/trading-api:latest
            ${{ env.IMAGE_PREFIX }}/trading-api:${{ github.sha }}
          cache-from: type=gha,scope=trading-api
          cache-to: type=gha,mode=max,scope=trading-api

      # --- 前端 Dashboard ---
      - name: 建構 & 推送 web-dashboard
        uses: docker/build-push-action@v6
        with:
          context: ./web-dashboard
          file: ./web-dashboard/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/web-dashboard:latest
            ${{ env.IMAGE_PREFIX }}/web-dashboard:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://trading-api:8080
          cache-from: type=gha,scope=web-dashboard
          cache-to: type=gha,mode=max,scope=web-dashboard

  # ============================================================
  # 2. 部署到正式環境 + Health Check
  # ============================================================
  deploy:
    name: 🚀 部署到正式環境
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: 透過 SSH 部署
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd /root/crypto-signal-trader
            git pull origin main

            # 登入 GHCR（用 PAT 或 deploy token）
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 拉取預建映像 & 啟動（不再 --build）
            docker compose -f docker-compose.cloud.yml pull
            docker compose -f docker-compose.cloud.yml up -d

            # 清理舊映像
            docker image prune -f

      - name: ⏳ Health Check（等待服務啟動）
        run: |
          echo "等待 90 秒讓容器啟動..."
          sleep 90

          # 最多重試 5 次，每次間隔 15 秒
          for i in 1 2 3 4 5; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://hook-fi.com/api/health || echo "000")
            echo "Health check #$i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ 部署成功，服務正常運作"
              exit 0
            fi
            echo "等待 15 秒後重試..."
            sleep 15
          done

          echo "❌ Health check 失敗，服務可能未正常啟動"
          exit 1

  # ============================================================
  # 3. 部署失敗通知（任一 job 失敗時觸發）
  # ============================================================
  notify-failure:
    name: 🔔 部署失敗通知
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy]
    if: failure()

    steps:
      - name: 發送 Discord 通知
        env:
          WEBHOOK_URL: ${{ secrets.CD_DISCORD_WEBHOOK }}
        if: env.WEBHOOK_URL != ''
        run: |
          curl -sf -H "Content-Type: application/json" \
            -d "{
              \"content\": \"🚨 **CD 部署失敗**\n\n📦 Commit: \`${{ github.sha }}\`\n🔗 [查看 Workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n⏰ $(date -u '+%Y-%m-%d %H:%M UTC')\"
            }" \
            "$WEBHOOK_URL" || echo "Discord 通知發送失敗"

      - name: 輸出失敗摘要
        run: |
          echo "## ❌ CD 部署失敗" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **時間**: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **觸發**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "請檢查 [Workflow 日誌](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
