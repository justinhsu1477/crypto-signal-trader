name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  # ============================================================
  # 1. Secret 洩漏檢測（gitleaks）
  # ============================================================
  gitleaks:
    name: Secret Leak Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # 2. Backend Build + Test + Coverage（JaCoCo）
  # ============================================================
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'gradle-wrapper.properties') }}

      - name: Build & Test
        run: ./gradlew clean build -x bootJar --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Test Report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit Results
          path: build/test-results/test/*.xml
          reporter: java-junit

      - name: Coverage Report
        if: success()
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 50
          title: "☂️ Test Coverage"
          update-comment: true

  # ============================================================
  # 3. Frontend Build + ESLint
  # ============================================================
  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web-dashboard/package-lock.json

      - name: Install
        working-directory: web-dashboard
        run: npm ci

      - name: ESLint
        working-directory: web-dashboard
        run: npm run lint

      - name: Build
        working-directory: web-dashboard
        run: npm run build

  # ============================================================
  # 4. Docker Build 驗證（不 push，只確認能建成功）
  # ============================================================
  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Backend Image
        run: docker build -t crypto-trader-api:ci .

      - name: Build Dashboard Image
        run: docker build -t crypto-trader-web:ci ./web-dashboard

      - name: Build Monitor Image
        run: docker build -t crypto-trader-monitor:ci ./discord-monitor
