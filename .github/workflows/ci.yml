name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  # ============================================================
  # 1. 密鑰洩漏掃描
  # ============================================================
  gitleaks:
    name: 🔐 密鑰洩漏掃描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # 2. 後端建構 & 測試（Java）
  # ============================================================
  backend:
    name: ☕ 後端建構 & 測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'gradle-wrapper.properties') }}

      - name: 建構 & 測試
        run: ./gradlew clean build -x bootJar --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: 測試報告
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit 測試結果
          path: build/test-results/test/*.xml
          reporter: java-junit

      - name: 覆蓋率報告
        if: success()
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 50
          title: "☂️ 測試覆蓋率"
          update-comment: true

  # ============================================================
  # 3. 前端檢查 & 建構（Next.js）
  # ============================================================
  frontend:
    name: ⚛️ 前端檢查 & 建構
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web-dashboard/package-lock.json

      - name: 安裝依賴
        working-directory: web-dashboard
        run: npm ci

      - name: ESLint 檢查
        working-directory: web-dashboard
        run: npm run lint

      - name: 建構
        working-directory: web-dashboard
        run: npm run build

  # ============================================================
  # 4. Monitor 測試（Python）
  # ============================================================
  monitor:
    name: 🐍 Monitor 測試
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord-monitor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: discord-monitor/requirements.txt

      - name: 安裝依賴
        run: pip install -r requirements.txt pytest pytest-asyncio

      - name: 執行測試
        run: python -m pytest tests/ -v --tb=short

  # ============================================================
  # 5. Docker 建構驗證
  # ============================================================
  docker:
    name: 🐳 Docker 建構驗證
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 建構 API 映像
        run: docker build -t crypto-trader-api:ci .

      - name: 建構 Dashboard 映像
        run: docker build -t crypto-trader-web:ci ./web-dashboard

      - name: 建構 Monitor 映像
        run: docker build -t crypto-trader-monitor:ci ./discord-monitor
