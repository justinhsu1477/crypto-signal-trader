name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 推新 commit 自動取消舊 CI（只對 PR；main push 不取消，避免中斷 CD chain）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  # ============================================================
  # 0. Path filter — 偵測哪些路徑變了
  # 後面每個 job 用 needs.changes.outputs.X 決定要不要跑
  # ============================================================
  changes:
    name: 📋 Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      monitor: ${{ steps.filter.outputs.monitor }}
      docker: ${{ steps.filter.outputs.docker }}
      deploy_config: ${{ steps.filter.outputs.deploy_config }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # main push 沒有 base ref；對 main 永遠 true 確保部署前最後驗一次
          base: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
          filters: |
            backend:
              - 'src/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle.properties'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - 'proto/**'
              - 'lombok.config'
            frontend:
              - 'web-dashboard/**'
            monitor:
              - 'discord-monitor/**'
              - 'proto/**'
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'web-dashboard/Dockerfile'
              - 'discord-monitor/Dockerfile'
            deploy_config:
              - 'docker-compose*.yml'
              - 'Caddyfile'
            workflows:
              - '.github/workflows/**'
              - '.github/dependabot.yml'
              - 'release-please-config.json'
              - '.release-please-manifest.json'

  # ============================================================
  # 0b. Workflow lint — GitHub Actions 語法 / expression / shellcheck
  # ============================================================
  workflow_lint:
    name: 🧪 Workflow Lint
    needs: changes
    if: ${{ needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # rhysd/actionlint 是 CLI 工具不是 GitHub Action，要用官方 install script。
      # 鎖版本避免上游突然炸：v1.7.12（current latest 2026-05）
      - name: Install actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
      - name: Run actionlint
        run: ./actionlint -color

  # ============================================================
  # 1. 密鑰洩漏掃描 — 永遠跑（security gate，無論改什麼）
  # ============================================================
  gitleaks:
    name: 🔐 密鑰洩漏掃描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # 2. 後端建構 & 測試（Java）
  # 只在 src / build.gradle / proto / workflow 改動時跑
  # ============================================================
  backend:
    name: ☕ 後端建構 & 測試
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'gradle-wrapper.properties') }}

      - name: 建構 & 測試
        run: ./gradlew clean build -x bootJar --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: 測試報告
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit 測試結果
          path: build/test-results/test/*.xml
          reporter: java-junit
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 覆蓋率報告
        if: success()
        uses: madrapps/jacoco-report@v1.7.2
        with:
          paths: build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 70
          title: "☂️ 測試覆蓋率"
          update-comment: true

  # ============================================================
  # 2b. Integration Test（Testcontainers — PostgreSQL）
  # 只在 backend 跑過且成功時才跑（needs.backend.result == success）
  # ============================================================
  integration-test:
    name: 🔬 Integration Test
    needs: [changes, backend]
    if: ${{ (needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true') && needs.backend.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'gradle-wrapper.properties') }}

      - name: 執行 Integration Test
        run: ./gradlew integrationTest --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: integration-test

      - name: Integration Test 報告
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Integration Test 結果
          path: build/test-results/integrationTest/*.xml
          reporter: java-junit
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 失敗時上傳測試報告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: build/reports/tests/integrationTest/
          retention-days: 7

  # ============================================================
  # 3. 前端檢查、測試 & 建構（Next.js）
  # 只在 web-dashboard 改動時跑
  # ============================================================
  frontend:
    name: ⚛️ 前端檢查、測試 & 建構
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web-dashboard/package-lock.json

      - name: 安裝依賴
        working-directory: web-dashboard
        run: npm ci

      - name: ESLint 檢查
        working-directory: web-dashboard
        run: npm run lint

      - name: 前端測試
        working-directory: web-dashboard
        run: npm test

      - name: 建構
        working-directory: web-dashboard
        run: npm run build

  # ============================================================
  # 4. Monitor 測試（Python）
  # 只在 discord-monitor 或 proto 改動時跑
  # ============================================================
  monitor:
    name: 🐍 Monitor 測試
    needs: changes
    if: ${{ needs.changes.outputs.monitor == 'true' || needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord-monitor
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: discord-monitor/requirements.txt

      - name: 安裝依賴
        run: pip install -r requirements.txt pytest pytest-asyncio

      - name: 執行測試
        run: python -m pytest tests/ -v --tb=short

  # ============================================================
  # 5. Docker 建構驗證
  # 任一 source / Dockerfile 改動就跑（避免 deploy 時才發現 build 壞）
  # ============================================================
  docker:
    name: 🐳 Docker 建構驗證
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.monitor == 'true' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: 建構 API 映像
        run: docker build -t crypto-trader-api:ci .

      - name: 建構 Dashboard 映像
        run: docker build -t crypto-trader-web:ci ./web-dashboard

      - name: 建構 Monitor 映像
        run: docker build -t crypto-trader-monitor:ci ./discord-monitor

  # ============================================================
  # 6. 部署設定驗證
  # Compose / Caddy 只改設定也要有 gate，避免 CD 才炸
  # ============================================================
  deploy_config:
    name: 🧭 部署設定驗證
    needs: changes
    if: ${{ needs.changes.outputs.deploy_config == 'true' || needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Docker Compose config 驗證
        run: |
          # compose 在 parse 階段就會讀 env_file 確認存在；CI 沒有 prod secrets，
          # 給空檔頂著 — 純檢 YAML 結構 / image / volume 拼錯，env 內容不在這層管。
          touch .env .env.dev .env.prod
          docker compose -f docker-compose.cloud.yml config --no-env-resolution --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile local-db config --no-env-resolution --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --no-env-resolution --quiet

      - name: Caddyfile 語法驗證
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine \
            caddy adapt --config /etc/caddy/Caddyfile --pretty > /tmp/caddy-adapted.json

  # ============================================================
  # 🚦 CI Summary — 聚合所有 job 結果
  # 這是「唯一」branch protection 該 require 的 status check
  # success / skipped 都算過；failure / cancelled 才算沒過
  # ============================================================
  ci-summary:
    name: ✅ CI Summary
    needs: [changes, workflow_lint, gitleaks, backend, integration-test, frontend, monitor, docker, deploy_config]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 驗證所有 job 結果
        run: |
          # GitHub job result 可能是: success, failure, cancelled, skipped
          # 規則：success / skipped 算過；其他全算沒過
          all_ok=true
          declare -A jobs=(
            [workflow-lint]="${{ needs.workflow_lint.result }}"
            [gitleaks]="${{ needs.gitleaks.result }}"
            [backend]="${{ needs.backend.result }}"
            [integration-test]="${{ needs.integration-test.result }}"
            [frontend]="${{ needs.frontend.result }}"
            [monitor]="${{ needs.monitor.result }}"
            [docker]="${{ needs.docker.result }}"
            [deploy-config]="${{ needs.deploy_config.result }}"
          )

          echo "=== CI Job Results ==="
          for name in workflow-lint gitleaks backend integration-test frontend monitor docker deploy-config; do
            r="${jobs[$name]}"
            case "$r" in
              success) echo "  ✅ $name: $r" ;;
              skipped) echo "  ⏭️  $name: $r (path 不相關，跳過)" ;;
              *)       echo "  ❌ $name: $r"; all_ok=false ;;
            esac
          done
          echo "======================"

          if $all_ok; then
            echo "All required CI checks passed or skipped"
            exit 0
          else
            echo ""
            echo "❌ One or more required jobs failed or were cancelled"
            exit 1
          fi
